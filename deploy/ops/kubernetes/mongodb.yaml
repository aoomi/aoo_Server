apiVersion: v1
kind: Service
metadata: {name: mongodb, namespace: aoo-production, labels: {app.kubernetes.io/name: mongodb}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mongodb}
  ports: [{name: mongodb, port: 27017, targetPort: mongodb}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongodb, namespace: aoo-production}
spec:
  serviceName: mongodb
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mongodb}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mongodb, aoo.io/plane: data}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mongodb
          image: mongo:8.0.29-noble
          args: [mongod, --bind_ip_all]
          ports: [{name: mongodb, containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, valueFrom: {secretKeyRef: {name: aoo-runtime-secrets, key: MONGODB_USERNAME}}}
            - {name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: aoo-runtime-secrets, key: MONGODB_PASSWORD}}}
          startupProbe: {tcpSocket: {port: mongodb}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: mongodb}, failureThreshold: 3, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: mongodb}, failureThreshold: 3, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 4Gi}}
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 100Gi}}}
