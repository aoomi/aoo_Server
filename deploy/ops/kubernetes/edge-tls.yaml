apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoo-account
  namespace: aoo-production
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts: [account.production.invalid]
      secretName: aoo-account-edge-tls
  rules:
    - host: account.production.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aoo-account, port: {name: http}}
