name: architecture-drift
on:
  pull_request:
  push:
    branches: [main]
jobs:
  reconcile:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3.9'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.11', cache: pip}
      - run: python -m pip install --requirement requirements-tools.txt
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '25'
          cache: maven
      - name: Reconcile code, schema, protocol, prefab and dependencies
        run: ruby scripts/audit-drift10-continuous-drift.rb
      - name: Verify tool runtime lock
        run: ruby tools/check_tool_runtime_lock.rb
      - name: Reject undeclared or oversized files
        run: ruby tools/check_large_file_policy.rb
      - name: Reject new direct client network, storage, native and bundle calls
        run: ruby scripts/audit-cnet01-10-network-boundaries.rb --check
      - name: Build and test
        run: ./mvnw verify
      - name: Hash Reactor artifacts
        run: find server -path '*/target/*.jar' -type f -print0 | sort -z | xargs -0 shasum -a 256 | sed 's#  .*/server/#  server/#' > artifact-${{ matrix.os }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-hash-${{ matrix.os }}
          path: artifact-${{ matrix.os }}.sha256
  compare:
    needs: reconcile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: artifact-hash-*, merge-multiple: true}
      - run: diff -u artifact-ubuntu-24.04.sha256 artifact-macos-15.sha256
