#
# redis 开关
redis.open=true
redis.isPool=true
redis.url=127.0.0.1
redis.port=6379
redis.password=
redis.timeout=10000
redis.blockWhenExhausted=false
redis.evictionPolicyClassName=org.apache.commons.pool2.impl.DefaultEvictionPolicy
redis.jmxEnabled=true
redis.maxIdle=8
redis.maxTotal=100
redis.maxWaitMillis=-1
redis.testOnBorrow=false
